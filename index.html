<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var isExt = function (src, stack) {
          return (
            (typeof src === 'string' && /^(chrome|moz|safari)-extension:\/\//.test(src)) ||
            (typeof stack === 'string' && /(chrome|moz|safari)-extension:\/\//.test(stack))
          );
        };
        window.addEventListener(
          'error',
          function (e) {
            if (isExt(e.filename, e.error && e.error.stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (isExt('', e.reason && e.reason.stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
