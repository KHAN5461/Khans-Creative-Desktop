<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Khan's Creative Desktop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              roboto: ['Roboto', 'sans-serif'],
              mono: ['monospace'],
            },
            colors: {
              // Semantic Colors mapped to CSS Variables
              bg: 'var(--bg-app)',
              surface: 'var(--bg-surface)',
              'text-main': 'var(--text-main)',
              'text-muted': 'var(--text-muted)',
              border: 'var(--border-main)',
              
              // Tonal Access (if specific needed)
              primary: {
                DEFAULT: 'var(--primary-40)',
                container: 'var(--primary-90)',
                on: 'var(--primary-100)',
                100: 'var(--primary-100)',
                40: 'var(--primary-40)', // Main brand color typically
                95: 'var(--primary-95)',
              },
              secondary: {
                95: 'var(--secondary-95)',
              },
              neutral: {
                10: 'var(--neutral-10)',
                90: 'var(--neutral-90)',
              },
              error: 'var(--error-40)',
            },
            boxShadow: {
              'soft': 'var(--shadow-soft)',
              'medium': 'var(--shadow-medium)',
              'hard': 'var(--shadow-hard)',
            },
            backdropBlur: {
               'glass': 'var(--glass-blur)',
            }
          }
        }
      }
    </script>
    <style>
      /* Global Smooth Transition */
      body, div, span, button, input {
        transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, box-shadow, opacity;
        transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
        transition-duration: 150ms;
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        overscroll-behavior: none;
        background-color: var(--bg-app);
        /* Background is now handled by DesktopEnvironment.tsx for responsive behavior */
        color: var(--text-main);
      }
      
      /* Hide scrollbar */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
